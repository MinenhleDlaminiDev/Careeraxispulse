name: Build & Deploy to cPanel

on:
  push:
    branches: [ Main ]
  workflow_dispatch:   # allow manual runs from the Actions tab

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # AXIS-48 — DO NOT REMOVE THIS env BLOCK.
      #
      # Vite inlines import.meta.env at BUILD time, so these have to be present
      # here, not at runtime. Without them src/supabase.js sees no URL or key,
      # isConfigured is false, the client is null, and every /portal/* screen
      # renders "Portal not configured". The build still SUCCEEDS and the
      # marketing pages still look right — the portal is just silently dead.
      #
      # These are repository VARIABLES, not secrets, on purpose: all three are
      # inlined into the shipped bundle and readable by anyone who opens the
      # site. Supabase designs the publishable key to be public and RLS is what
      # protects the data. The FTP credentials below are a different matter and
      # stay secrets.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_GOOGLE_AUTH: ${{ vars.VITE_GOOGLE_AUTH }}

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps            # use ftp only if your host has no FTPS
          local-dir: ./dist/
          server-dir: ./            # FTP account is rooted at public_html, so deploy to its root
