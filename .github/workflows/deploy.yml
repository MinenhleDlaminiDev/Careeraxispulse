name: Build & Deploy to cPanel

on:
  push:
    branches: [ Main ]
  workflow_dispatch:   # allow manual runs from the Actions tab

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # AXIS-48 — DO NOT REMOVE THIS env BLOCK.
      #
      # Vite inlines import.meta.env at BUILD time, so these have to be present
      # here, not at runtime. Without them src/supabase.js sees no URL or key,
      # isConfigured is false, the client is null, and every /portal/* screen
      # renders "Portal not configured". The build still SUCCEEDS and the
      # marketing pages still look right — the portal is just silently dead.
      #
      # These read from SECRETS, not repository variables. Note that none of
      # the three is actually confidential: Vite inlines all of them into the
      # bundle, so anyone who opens the site can read them. Supabase designs
      # the publishable key to be public, and RLS is what protects the data.
      # They live in secrets because that is where the project keeps them.
      #
      # Two consequences worth knowing. GitHub masks secret values in logs, so
      # VITE_GOOGLE_AUTH holding "true" blanks that word out of the log
      # everywhere it appears. And `vars.X` and `secrets.X` are separate
      # stores: a value added to the wrong one reads back as empty, with no
      # error, which is exactly how the 22 Nov release shipped a dead portal.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_GOOGLE_AUTH: ${{ secrets.VITE_GOOGLE_AUTH }}

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps            # use ftp only if your host has no FTPS
          local-dir: ./dist/
          server-dir: ./            # FTP account is rooted at public_html, so deploy to its root
